services:
  architect:
    build:
      context: .
      dockerfile: Dockerfile
    image: architect-as-a-service:latest
    container_name: architect-as-a-service
    ports:
      - "4321:4321"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "4321"
      # Relative weight of the canonical "To zależy" archetype (others = 1).
      ARCHITECT_CANON_WEIGHT: "2"
      # Probability the cynical variant phrasing is used instead of the base one.
      ARCHITECT_VARIANT_PROBABILITY: "0.3"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4321/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
